name: Pull Request Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR validation must never need repository secrets or write permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core CLI and browser extension
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build CLI and run build gates
        run: npm run build

      - name: Typecheck CLI and server
        run: npm run typecheck

      - name: Typecheck browser extension
        run: npm run typecheck:ext

      - name: Build Chrome and Firefox extensions
        run: npm run build:ext

      - name: Run root test suite
        run: npm test

  vscode-extension:
    name: VS Code / Cursor / Windsurf extension
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/ext-vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ext-vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck extension
        run: npm run typecheck

      - name: Run extension tests
        run: npm test

      - name: Build extension bundle
        run: npm run build
